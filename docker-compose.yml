services:
  backend:
    build: ./backend
    container_name: apppulse_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:secretpassword@db:5432/apppulse
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis
    networks:
      - app-net

  db:
    image: postgres:15-alpine
    container_name: apppulse_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: apppulse
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-net

  redis:
    image: redis:7-alpine
    container_name: apppulse_redis
    restart: always
    networks:
      - app-net

volumes:
  postgres_data:

networks:
  app-net:
    driver: bridge
