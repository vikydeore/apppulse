<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AppPulse - Uptime & Performance Monitor</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased">

    <!-- Navigation Header -->
    <header class="border-b border-slate-800 bg-slate-900/50 backdrop-blur sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="h-3 w-3 rounded-full bg-emerald-500 animate-pulse"></div>
                <span class="text-xl font-bold tracking-tight text-white">AppPulse</span>
                <span class="text-xs px-2 py-0.5 rounded bg-slate-800 text-slate-400 border border-slate-700">Live Uptime</span>
            </div>
            <div class="text-sm text-slate-400">
                Server: <span class="text-slate-200 font-mono">Ubuntu VPS</span>
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="max-w-7xl mx-auto px-6 py-10">
        
        <!-- Stats Overview Cards -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
            <div class="bg-slate-900 border border-slate-800 rounded-xl p-6 shadow-sm">
                <h3 class="text-sm font-medium text-slate-400">Total Monitored URLs</h3>
                <p id="total-count" class="text-3xl font-bold text-white mt-2">0</p>
            </div>
            <div class="bg-slate-900 border border-slate-800 rounded-xl p-6 shadow-sm">
                <h3 class="text-sm font-medium text-slate-400">Operational Systems</h3>
                <p id="up-count" class="text-3xl font-bold text-emerald-400 mt-2">0</p>
            </div>
            <div class="bg-slate-900 border border-slate-800 rounded-xl p-6 shadow-sm">
                <h3 class="text-sm font-medium text-slate-400">System Status</h3>
                <p class="text-3xl font-bold text-indigo-400 mt-2">Normal</p>
            </div>
        </div>

        <!-- Add URL Section -->
        <div class="bg-slate-900 border border-slate-800 rounded-xl p-6 mb-10 shadow-sm">
            <h2 class="text-lg font-semibold text-white mb-4">Add Endpoint to Monitor</h2>
            <form id="add-url-form" class="flex flex-col sm:flex-row gap-4">
                <input type="text" id="site-name" placeholder="Service Name (e.g., My Blog)" required
                    class="flex-1 bg-slate-950 border border-slate-800 rounded-lg px-4 py-2.5 text-slate-100 focus:outline-none focus:border-indigo-500">
                <input type="url" id="site-url" placeholder="https://example.com" required
                    class="flex-2 bg-slate-950 border border-slate-800 rounded-lg px-4 py-2.5 text-slate-100 focus:outline-none focus:border-indigo-500">
                <button type="submit"
                    class="bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-6 py-2.5 rounded-lg transition">
                    Add Monitor
                </button>
            </form>
        </div>

        <!-- Monitored Endpoints Table -->
        <div class="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden shadow-sm">
            <div class="px-6 py-4 border-b border-slate-800 flex justify-between items-center">
                <h2 class="text-lg font-semibold text-white">Monitored Endpoints</h2>
                <button onclick="loadMonitors()" class="text-xs text-indigo-400 hover:text-indigo-300">Refresh</button>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-slate-800 text-slate-400 text-xs uppercase tracking-wider bg-slate-950/50">
                            <th class="px-6 py-3">Name</th>
                            <th class="px-6 py-3">URL</th>
                            <th class="px-6 py-3">Status</th>
                            <th class="px-6 py-3">Response Time</th>
                            <th class="px-6 py-3 text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="monitors-table-body" class="divide-y divide-slate-800 text-sm">
                        <tr>
                            <td colspan="5" class="px-6 py-6 text-center text-slate-500">Loading monitors...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Dashboard Frontend Logic -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            async function loadMonitors() {
                try {
                    const response = await fetch('/api/monitors');
                    const monitors = await response.json();
                    
                    const tbody = document.getElementById('monitors-table-body');
                    const totalCount = document.getElementById('total-count');
                    const upCount = document.getElementById('up-count');
                    
                    totalCount.innerText = monitors.length;
                    let operationalCount = 0;

                    if (monitors.length === 0) {
                        tbody.innerHTML = `<tr><td colspan="5" class="px-6 py-6 text-center text-slate-500">No endpoints monitored yet. Add one above!</td></tr>`;
                        upCount.innerText = '0';
                        return;
                    }

                    tbody.innerHTML = '';
                    monitors.forEach(m => {
                        if (m.status === 'Operational') operationalCount++;
                        
                        // Dynamic badge colors: green for operational, red for down
                        const isOp = m.status === 'Operational';
                        const badgeClass = isOp 
                            ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20' 
                            : 'bg-rose-500/10 text-rose-400 border-rose-500/20';
                        
                        tbody.innerHTML += `
                            <tr class="hover:bg-slate-800/50 transition">
                                <td class="px-6 py-4 font-medium text-white">${m.name}</td>
                                <td class="px-6 py-4 text-slate-400 font-mono text-xs"><a href="${m.url}" target="_blank" class="hover:underline">${m.url}</a></td>
                                <td class="px-6 py-4">
                                    <span class="px-2.5 py-1 text-xs rounded-full border ${badgeClass}">${m.status}</span>
                                </td>
                                <td class="px-6 py-4 text-slate-300 font-mono">${m.response_time}</td>
                                <td class="px-6 py-4 text-right">
                                    <button onclick="deleteMonitor(${m.id})" class="text-rose-400 hover:text-rose-300 text-xs font-medium px-2.5 py-1 rounded bg-rose-500/10 border border-rose-500/20 transition">
                                        Delete
                                    </button>
                                </td>
                            </tr>
                        `;
                    });
                    upCount.innerText = operationalCount;
                } catch (error) {
                    console.error('Error loading monitors:', error);
                }
            }

            async function deleteMonitor(id) {
                if (!confirm('Are you sure you want to delete this monitor?')) return;
                try {
                    const response = await fetch(`/api/monitors/${id}`, {
                        method: 'DELETE'
                    });
                    if (response.ok) {
                        loadMonitors();
                    } else {
                        alert('Failed to delete monitor.');
                    }
                } catch (error) {
                    console.error('Error deleting monitor:', error);
                }
            }

            const addForm = document.getElementById('add-url-form');
            if (addForm) {
                addForm.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    const name = document.getElementById('site-name').value;
                    const url = document.getElementById('site-url').value;

                    const response = await fetch('/api/monitors', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name, url })
                    });

                    if (response.ok) {
                        document.getElementById('site-name').value = '';
                        document.getElementById('site-url').value = '';
                        loadMonitors();
                    } else {
                        alert('Failed to add monitor.');
                    }
                });
            }

            // Expose functions globally for inline event handlers
            window.loadMonitors = loadMonitors;
            window.deleteMonitor = deleteMonitor;

            loadMonitors();
        });
    </script>
</body>
</html>
